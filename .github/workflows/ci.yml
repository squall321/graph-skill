name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Forward-compat for the GitHub Actions Node20-runtime deprecation (forces JS actions to Node24).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postprocess,cad3d,web,test]"
          python -m playwright install --with-deps chromium

      - name: Build gallery (feeds the freshness gate + smoke)
        run: python build_gallery.py

      - name: pytest (renders root artifacts; incl. freshness gate + visual tests)
        run: pytest tests/ -q

      - name: Node engine suite
        run: |
          set -e
          python tests/render_node_fixtures.py   # legacy-named artifacts the node tests read
          for f in tests/node_*.mjs; do node "$f"; done

      - name: Full real-Chromium smoke (every type boots, zero console errors)
        run: python tests/playwright_smoke.py
